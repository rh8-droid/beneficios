<script>
/* =========================================================================
   VIA TALENTOS — FASE 3: relatórios, produtividade, recorrência, alertas e importação
   ========================================================================= */

/* ------------------------------ filtros reutilizáveis ------------------------------ */
function buildFilters(container, extra, onChange) {
  var fields = (extra || []).concat(DASH_FILTERS);
  container.innerHTML = fields.map(function (f) {
    var input = f.type === 'date' ? '<input type="date" data-f="' + f.k + '"' + (f.value ? ' value="' + f.value + '"' : '') + '>' :
      (f.type === 'select-fixed' ? '<select data-f="' + f.k + '">' + options(f.options, f.value || '', f.placeholder) + '</select>' :
        '<select data-f="' + f.k + '">' + options(f.list(), '', 'Todos') + '</select>');
    return '<label>' + esc(f.label) + input + '</label>';
  }).join('');
  if (onChange) $$('[data-f]', container).forEach(function (el) { el.addEventListener('change', onChange); });
}
function filterValues(container) {
  var f = {};
  $$('[data-f]', container).forEach(function (el) { if (el.value) f[el.dataset.f] = el.value; });
  return f;
}

/* ------------------------------ view: indicadores e relatórios ------------------------------ */
var REL = { aba: 'rel', ultimo: null };

function initRelatorios() {
  var tipos = Object.keys(S.lk.relatorios).map(function (k) { return { value: k, label: S.lk.relatorios[k] }; });
  buildFilters($('#relFilters'), [{ k: 'tipo', label: 'Relatório', type: 'select-fixed', options: tipos, value: 'geral', placeholder: undefined }]);
  $('[data-f="tipo"]', $('#relFilters')).closest('label').style.gridColumn = 'span 2';
  $('#relGerar').addEventListener('click', gerarRelatorio);
  $('#relExcel').addEventListener('click', exportarExcel);
  $('#relPdf').addEventListener('click', exportarPdf);
  buildFilters($('#prodFilters'), [], loadProdutividade);
  var hoje = todayIso();
  var ini = new Date(); ini.setMonth(ini.getMonth() - 5); ini.setDate(1);
  var iniIso = ini.getFullYear() + '-' + String(ini.getMonth() + 1).padStart(2, '0') + '-01';
  $('#recFilters').innerHTML =
    '<label>Período A — de<input type="date" data-f="de" value="' + iniIso + '"></label><label>até<input type="date" data-f="ate" value="' + hoje + '"></label>' +
    '<label>Comparar com — de<input type="date" data-f="deB"></label><label>até<input type="date" data-f="ateB"></label>' +
    ['Empresa', 'Unidade', 'Gestor', 'Departamento'].map(function (k) { var f = DASH_FILTERS.filter(function (x) { return x.k === k; })[0]; return '<label>' + f.label + '<select data-f="' + k + '">' + options(f.list(), '', 'Todos') + '</select></label>'; }).join('');
  $$('[data-f]', $('#recFilters')).forEach(function (el) { el.addEventListener('change', loadRecorrencia); });
  $$('[data-rtab]').forEach(function (b) {
    b.addEventListener('click', function () {
      REL.aba = b.dataset.rtab;
      $$('[data-rtab]').forEach(function (x) { x.classList.toggle('active', x === b); });
      $$('[data-rpane]').forEach(function (p) { p.classList.toggle('hidden', p.dataset.rpane !== REL.aba); });
      loadRelatoriosView();
    });
  });
}

function loadRelatoriosView() {
  if (REL.aba === 'rel') return REL.ultimo ? null : gerarRelatorio();
  if (REL.aba === 'prod') return loadProdutividade();
  return loadRecorrencia();
}

function relParams() {
  var f = filterValues($('#relFilters'));
  var tipo = f.tipo || 'geral';
  delete f.tipo;
  return { tipo: tipo, filtros: f };
}

function gerarRelatorio() {
  var p = relParams();
  setSync('Gerando relatório…');
  return api('relatorio', p).then(function (r) {
    REL.ultimo = r;
    $('#relInfo').textContent = r.linhas.length + ' linha(s) · ' + r.filtros;
    $('#relResumo').innerHTML = (r.resumo || []).map(function (x) { return card(x.label, esc(x.valor), '', '', 'chart'); }).join('');
    $('#relTabela').innerHTML = (r.nota ? '<p class="muted">' + esc(r.nota) + '</p>' : '') + (r.linhas.length ?
      '<div class="table-wrap"><div class="table-head"><h3>' + esc(r.titulo) + '</h3><span class="muted">Gerado em ' + fmtDate(r.geradoEm) + '</span></div><table><thead><tr>' +
      r.colunas.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      r.linhas.map(function (l) { return '<tr>' + l.map(function (c) { return '<td>' + (typeof c === 'number' ? num(c) : esc(c)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' :
      '<div class="empty">Nenhum registro para os filtros selecionados.</div>');
    setSync('Relatório gerado');
  }).catch(fail);
}

function nomeArquivo(ext) { return 'via-talentos-' + (REL.ultimo ? REL.ultimo.tipo : 'relatorio') + '-' + todayIso() + '.' + ext; }

function exportarExcel() {
  var go = REL.ultimo && JSON.stringify(relParams()) === REL.ultimoParams ? Promise.resolve(REL.ultimo) : gerarRelatorio().then(function () { return REL.ultimo; });
  REL.ultimoParams = JSON.stringify(relParams());
  go.then(function (r) {
    if (!r) return;
    var linhas = [r.colunas].concat(r.linhas);
    if (window.XLSX) {
      var wb = XLSX.utils.book_new();
      var ws = XLSX.utils.aoa_to_sheet(linhas);
      ws['!cols'] = r.colunas.map(function (c, i) { var w = Math.max(String(c).length, ...r.linhas.slice(0, 200).map(function (l) { return String(l[i] === undefined ? '' : l[i]).length; })); return { wch: Math.min(60, Math.max(8, w + 2)) }; });
      XLSX.utils.book_append_sheet(wb, ws, 'Dados');
      var info = [['Relatório', r.titulo], ['Filtros', r.filtros], ['Gerado em', fmtDate(r.geradoEm)], ['Gerado por', r.geradoPor], []].concat((r.resumo || []).map(function (x) { return [x.label, x.valor]; }));
      if (r.nota) info.push([], ['Observação', r.nota]);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), 'Resumo');
      XLSX.writeFile(wb, nomeArquivo('xlsx'));
    } else {
      var csv = '﻿' + linhas.map(function (l) { return l.map(function (c) { var s = c === undefined || c === null ? '' : String(c); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';'); }).join('\n');
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = nomeArquivo('csv'); a.click();
      toast('Biblioteca do Excel indisponível: exportado em CSV (abre no Excel).');
    }
  }).catch(fail);
}

function exportarPdf() {
  var p = relParams();
  setSync('Gerando PDF…');
  api('relatorioPdf', p).then(function (r) {
    var bin = atob(r.base64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' })); a.download = r.nome; a.click();
    setSync('PDF gerado');
  }).catch(fail);
}

/* ------------------------------ produtividade ------------------------------ */
function loadProdutividade() {
  setSync('Calculando produtividade…');
  return api('produtividade', filterValues($('#prodFilters'))).then(function (r) {
    var a = r.analistas;
    var labels = a.map(function (x) { return x.analista; });
    var num = function (v) { return v === '—' ? null : Number(v); };
    if (window.Chart && a.length) {
      var box = resetCanvas('chProdSla'); box.dataset.id = 'chProdSla';
      S.charts.chProdSla = new Chart(document.getElementById('chProdSla'), {
        data: { labels: labels, datasets: [
          { type: 'bar', label: 'Tempo médio (d.u.)', data: a.map(function (x) { return num(x.tempoMedio); }), backgroundColor: '#f2c200', borderRadius: 6, yAxisID: 'y' },
          { type: 'line', label: '% SLA cumprido', data: a.map(function (x) { return x.slaNum; }), borderColor: cssVar('--chart-alt'), backgroundColor: cssVar('--chart-alt'), yAxisID: 'y2' }
        ] },
        options: Object.assign(baseOptions(), { scales: {
          x: { grid: { color: cssVar('--chart-grid') }, ticks: { color: cssVar('--chart-text') } },
          y: { beginAtZero: true, grid: { color: cssVar('--chart-grid') }, ticks: { color: cssVar('--chart-text') }, title: { display: true, text: 'dias úteis', color: cssVar('--chart-text') } },
          y2: { beginAtZero: true, max: 100, position: 'right', grid: { display: false }, ticks: { color: cssVar('--chart-text'), callback: function (v) { return v + '%'; } } } } })
      });
    } else chartReady('chProdSla', false);
    barChart('chProdEspera', labels, [
      { label: 'Etapas do RH', data: a.map(function (x) { return num(x.esperaRH) || 0; }), backgroundColor: '#f2c200' },
      { label: 'Gestor / direção', data: a.map(function (x) { return num(x.esperaExterna) || 0; }), backgroundColor: cssVar('--chart-alt') }
    ]);
    $('#prodTabela').innerHTML = a.length ? '<div class="table-wrap"><table><thead><tr><th>Analista</th><th>Vagas</th><th>Posições abertas</th><th>Concluídas</th><th>Preenchidas</th><th>Candidaturas</th><th>Entrevistas</th><th>Encaminhados ao gestor</th><th>Contratações</th><th>Tempo médio</th><th>% SLA</th><th>Pendências</th><th>Espera RH</th><th>Espera gestor/direção</th></tr></thead><tbody>' +
      a.map(function (x) {
        return '<tr><td><b>' + esc(x.analista) + '</b><br><span class="muted">' + x.ativas + ' ativa(s)</span></td><td>' + x.vagas + '</td><td>' + x.posicoesAbertas + '</td><td>' + x.concluidas + '</td><td>' + x.preenchidas + '</td><td>' + x.candidaturas + '</td><td>' + x.entrevistas + '</td><td>' + x.encaminhados + '</td><td>' + x.contratacoes + '</td>' +
          '<td>' + num(x.tempoMedio) + (x.tempoMedio !== '—' ? ' d.u.' : '') + '</td><td><b>' + esc(x.sla) + '</b></td><td>' + (x.pendencias ? '<span class="late">' + x.pendencias + '</span>' : '0') + '</td><td>' + num(x.esperaRH) + '</td><td>' + num(x.esperaExterna) + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="muted">Pendências = candidaturas com próxima ação vencida + vagas vencidas em aberto. A espera em gestor/direção é tempo de outras áreas e não entra na produtividade do analista.</p>' : '<div class="empty">Sem dados.</div>';
    setSync(r.filtros);
  }).catch(fail);
}

/* ------------------------------ recorrência ------------------------------ */
function loadRecorrencia() {
  setSync('Calculando recorrência…');
  return api('recorrencia', filterValues($('#recFilters'))).then(function (r) {
    var t = r.total;
    $('#recResumo').innerHTML = card('Requisições de vagas', t.requisicoes, 'accent', '', 'file') + card('Posições solicitadas', t.posicoes, '', '', 'target') +
      card('Posições preenchidas', t.preenchidas, 'green', '', 'userCheck') + card('Reaberturas', t.reaberturas, t.reaberturas ? 'orange' : '', 'da mesma requisição', 'alert') +
      card('Cargos distintos', r.cargos.length, '', '', 'briefcase');
    var top = r.cargos.slice(0, 6);
    var cores = ['#f2c200', cssVar('--chart-alt'), '#e57a12', '#3fb46b', '#2b6cb0', '#8f8f8f'];
    var labels = r.meses.map(function (m) { return m.substr(5) + '/' + m.substr(2, 2); });
    var canvas = chartReady('chRec', top.length > 0);
    if (canvas) S.charts.chRec = new Chart(canvas, { type: 'line', data: { labels: labels, datasets: top.map(function (c, i) { return { label: c.cargo, data: r.meses.map(function (m) { return c.porMes[m] || 0; }), borderColor: cores[i], backgroundColor: cores[i], tension: .25 }; }) }, options: baseOptions() });
    $('#recTabela').innerHTML = r.cargos.length ? '<div class="table-wrap"><div class="table-head"><h3>Histórico por cargo</h3></div><table><thead><tr><th>Cargo</th><th>Requisições</th><th>Posições solicitadas</th><th>Posições preenchidas</th><th>Reaberturas</th><th>Tempo médio</th><th>Principal motivo</th><th>Gestor que mais solicitou</th>' +
      r.meses.map(function (m) { return '<th>' + m.substr(5) + '/' + m.substr(2, 2) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      r.cargos.map(function (c) { return '<tr><td><b>' + esc(c.cargo) + '</b></td><td>' + c.requisicoes + '</td><td>' + c.posicoes + '</td><td>' + c.preenchidas + '</td><td>' + c.reaberturas + '</td><td>' + num(c.tempoMedio) + (c.tempoMedio !== '—' ? ' d.u.' : '') + '</td><td>' + esc(c.motivo) + '</td><td>' + esc(c.gestor) + '</td>' +
        r.meses.map(function (m) { return '<td>' + (c.porMes[m] || '·') + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">Nenhuma requisição no período.</div>';
    $('#recComparacao').innerHTML = r.comparacao ? '<div class="table-wrap"><div class="table-head"><h3>Comparação de períodos (A × B)</h3><span class="muted">Requisições A: ' + t.requisicoes + ' · B: ' + r.totalB.requisicoes + '</span></div><table><thead><tr><th>Cargo</th><th>Requisições A</th><th>Requisições B</th><th>Variação (B − A)</th><th>Posições A</th><th>Posições B</th><th>Preenchidas A</th><th>Preenchidas B</th></tr></thead><tbody>' +
      r.comparacao.map(function (c) { return '<tr><td>' + esc(c.cargo) + '</td><td>' + c.reqA + '</td><td>' + c.reqB + '</td><td><b style="color:' + (c.variacao > 0 ? 'var(--red)' : c.variacao < 0 ? 'var(--green)' : 'inherit') + '">' + (c.variacao > 0 ? '+' : '') + c.variacao + '</b></td><td>' + c.posA + '</td><td>' + c.posB + '</td><td>' + c.preA + '</td><td>' + c.preB + '</td></tr>'; }).join('') + '</tbody></table></div>' :
      '<p class="muted">Preencha "Comparar com" para comparar dois períodos.</p>';
    setSync(r.filtros);
  }).catch(fail);
}

/* ------------------------------ alertas (sino) ------------------------------ */
var ALERTAS = { dados: null, aba: 'meus' };
function loadAlertas() {
  return api('alertas').then(function (r) {
    ALERTAS.dados = r;
    var n = r.meus;
    $('#alertCount').textContent = n > 99 ? '99+' : n;
    $('#alertCount').classList.toggle('hidden', !n);
  }).catch(function () { /* silencioso no sino */ });
}
function abrirAlertas() {
  var r = ALERTAS.dados;
  if (!r) return loadAlertas().then(abrirAlertas);
  var lista = ALERTAS.aba === 'meus' ? r.alertas.filter(function (a) { return a.meu; }) : r.alertas;
  var html = '<div class="dlg-head"><h3>Alertas</h3><button class="btn small x" data-close>Fechar</button></div><div class="dlg-body">' +
    '<div class="tabs"><button data-al="meus" class="' + (ALERTAS.aba === 'meus' ? 'active' : '') + '">Para mim (' + r.meus + ')</button><button data-al="todos" class="' + (ALERTAS.aba === 'todos' ? 'active' : '') + '">Todos (' + r.total + ')</button></div>' +
    (lista.length ? lista.map(function (a, i) { return '<button class="alert-item ' + a.nivel + '" data-ai="' + i + '"><b>' + esc(a.titulo) + '</b><p>' + esc(a.texto) + '</p></button>'; }).join('') : '<div class="empty">Nenhum alerta. 👏</div>') + '</div>';
  var d = openDialog('#dlg2', html);
  $$('[data-al]', d).forEach(function (b) { b.addEventListener('click', function () { ALERTAS.aba = b.dataset.al; abrirAlertas(); }); });
  $$('[data-ai]', d).forEach(function (b) {
    b.addEventListener('click', function () {
      var a = lista[+b.dataset.ai];
      d.close();
      if (a.candidaturaId) openCandidatura(a.candidaturaId); else openVaga(a.vagaId);
    });
  });
}

/* ------------------------------ configurações: alertas e importação ------------------------------ */
CFG.AlertasEmail = { titulo: 'Alertas por e-mail', admin: true, custom: renderCfgAlertas };
CFG.Importacao = { titulo: 'Importar planilha antiga', admin: true, custom: renderCfgImportacao };

function renderCfgAlertas() {
  var ativo = (S.lk.config.ALERTAS_EMAIL || 'Não') === 'Sim';
  $('#cfgTable').innerHTML = '<div class="panel"><h2>Envio diário de alertas por e-mail</h2><p class="sub">Nos dias úteis, cada usuário ativo recebe os alertas do seu perfil: analistas recebem os das suas vagas, gestores as decisões pendentes, a direção as vagas vencidas e o Administrador RH todos.</p>' +
    '<div class="form-grid" style="max-width:640px"><label class="field span-2">Envio automático<select id="alAtivo">' + options(['Sim', 'Não'], ativo ? 'Sim' : 'Não') + '</select></label>' +
    '<label class="field span-2">Horário (hora cheia)<select id="alHora">' + options(Array.from({ length: 24 }, function (_, h) { return { value: String(h), label: String(h).padStart(2, '0') + ':00' }; }), S.lk.config.ALERTAS_HORA || '7') + '</select></label></div>' +
    '<div class="toolbar" style="margin-top:14px"><button class="btn primary" id="alSalvar">Salvar configuração</button><button class="btn" id="alTeste">Enviar alertas agora</button></div>' +
    '<p class="muted">Último envio: ' + fmtDate(S.lk.config.ULTIMO_ENVIO_ALERTAS) + '. O Google pedirá autorização para enviar e-mails e criar o agendamento na primeira vez.</p></div>';
  $('#alSalvar').addEventListener('click', function () {
    api('configurarAlertasEmail', { ativar: $('#alAtivo').value === 'Sim', hora: $('#alHora').value }).then(function (r) {
      toast(r.ativo ? 'Alertas diários ativados às ' + r.hora + 'h.' : 'Envio diário desativado.');
      return api('lookups').then(function (lk) { S.lk = lk; });
    }).catch(fail);
  });
  $('#alTeste').addEventListener('click', function () { api('enviarAlertasAgora').then(function (m) { toast(m); }).catch(fail); });
}

function renderCfgImportacao() {
  $('#cfgTable').innerHTML = '<div class="panel"><h2>Importar vagas de planilha antiga</h2><p class="sub">Lê uma aba desta mesma planilha (ex.: <b>RECRUTAMENTO</b> ou <b>Página6</b>) com as colunas ABERTURA DA VAGA, ANALISTA RESPONSÁVEL, FUNÇÃO, SETOR, VAGAS, STATUS DO PROCESSO, Vagas fechadas, Data Aprovação e Candidato Aprovado. ' +
    'Cada linha vira uma vaga com posições; linhas já importadas são ignoradas. Unidade e gestor ficam como "Não informado" para ajuste posterior.</p>' +
    '<div class="form-grid" style="max-width:720px"><label class="field span-2">Aba<select id="impAba"><option>Carregando…</option></select></label><label class="field span-2">Empresa<select id="impEmp">' + options(names(S.lk.empresas), 'Via Dupla') + '</select></label></div>' +
    '<div class="toolbar" style="margin-top:14px"><button class="btn" id="impPrev">Pré-visualizar</button><button class="btn primary" id="impExec" disabled>Importar</button></div><div id="impResultado"></div></div>';
  api('listAbasPlanilha').then(function (abas) {
    $('#impAba').innerHTML = options(abas, abas.indexOf('RECRUTAMENTO') >= 0 ? 'RECRUTAMENTO' : abas[0]);
  }).catch(fail);
  $('#impPrev').addEventListener('click', function () {
    $('#impResultado').innerHTML = '<p class="muted">Lendo a aba…</p>';
    api('previewImportacao', { aba: $('#impAba').value, empresa: $('#impEmp').value }).then(function (r) {
      $('#impExec').disabled = !r.novas;
      $('#impResultado').innerHTML = '<div class="cards" style="margin-top:12px">' + card('Vagas a importar', r.novas, 'accent', '', 'file') + card('Já importadas', r.ignoradas, '', 'serão ignoradas', 'check') + card('Linhas com problema', r.invalidas.length, r.invalidas.length ? 'orange' : '', '', 'alert') + '</div>' +
        '<p class="muted">Status convertidos: ' + r.porStatus.map(function (x) { return esc(x.label) + ' (' + x.valor + ')'; }).join(' · ') + '</p>' +
        (r.invalidas.length ? '<p class="muted">Problemas: ' + r.invalidas.slice(0, 20).map(function (x) { return 'linha ' + x.linha + ': ' + esc(x.motivo); }).join(' · ') + '</p>' : '') +
        (r.amostra.length ? '<div class="table-wrap"><table><thead><tr><th>Linha</th><th>Abertura</th><th>Cargo</th><th>Analista</th><th>Posições</th><th>Status original</th><th>Status no sistema</th><th>Preenchidas</th><th>Fechamento</th><th>Contratado</th></tr></thead><tbody>' +
          r.amostra.map(function (x) { return '<tr><td>' + x.linha + '</td><td>' + fmtDate(x.abertura) + '</td><td>' + esc(x.cargo) + '</td><td>' + esc(x.analista) + '</td><td>' + x.qtd + '</td><td>' + esc(x.statusOriginal) + '</td><td>' + statusBadge(x.status) + '</td><td>' + x.fechadas + '</td><td>' + fmtDate(x.fechamento) + '</td><td>' + esc(x.contratado) + '</td></tr>'; }).join('') +
          '</tbody></table></div><p class="muted">Mostrando as primeiras ' + r.amostra.length + ' linhas.</p>' : '');
    }).catch(function (e) { $('#impResultado').innerHTML = '<div class="form-error">' + esc(e.message) + '</div>'; });
  });
  $('#impExec').addEventListener('click', function () {
    if (!confirm('Importar as vagas da aba "' + $('#impAba').value + '"?')) return;
    $('#impExec').disabled = true;
    $('#impResultado').insertAdjacentHTML('afterbegin', '<p class="muted">Importando… isso pode levar alguns segundos.</p>');
    api('executarImportacao', { aba: $('#impAba').value, empresa: $('#impEmp').value }).then(function (r) {
      toast(r.importadas + ' vaga(s) importada(s). ' + r.ignoradas + ' já existiam.');
      $('#impPrev').click();
    }).catch(fail);
  });
}

/* ------------------------------ inicialização da Fase 3 ------------------------------ */
(function aguardarBootstrap3() {
  if (!S.lk) return setTimeout(aguardarBootstrap3, 120);
  initRelatorios();
  renderCfgTabs();
  $('#alertBtn').addEventListener('click', abrirAlertas);
  loadAlertas();
  setInterval(function () { if (!document.hidden) loadAlertas(); }, 300000);
})();
</script>
