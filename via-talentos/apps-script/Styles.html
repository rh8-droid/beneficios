<style>
:root {
  --bg: #0e0e0e;
  --bg-2: #151515;
  --surface: #1b1b1b;
  --surface-2: #232323;
  --surface-3: #2c2c2c;
  --line: #333333;
  --text: #ffffff;
  --text-2: #c9c9c9;
  --muted: #8f8f8f;
  --accent: #f2c200;
  --accent-ink: #111111;
  --accent-soft: rgba(242, 194, 0, .12);
  --green: #3fb46b;
  --yellow: #f2c200;
  --orange: #f08a24;
  --red: #e5484d;
  --neutral: #6e6e6e;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body { font-family: Inter, "Segoe UI", Roboto, system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px;
  background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%); border-right: 1px solid #222; z-index: 40;
  display: flex; flex-direction: column;
}
.brand { display: flex; gap: 12px; align-items: center; padding: 4px 8px 20px; border-bottom: 1px solid #262626; }
.brand-mark { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 900; letter-spacing: -.04em; overflow: hidden; flex: none; }
.brand-mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.brand strong { display: block; font-size: 16px; letter-spacing: .08em; }
.brand strong b { color: var(--accent); }
.brand span { display: block; font-size: 11px; color: var(--muted); }
.nav { display: grid; gap: 3px; margin-top: 18px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px;
  background: transparent; color: var(--text-2); text-align: left; font-weight: 600; cursor: pointer;
}
.nav button .n { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; background: #242424; color: var(--muted); flex: none; }
.nav button:hover { background: #1f1f1f; color: #fff; }
.nav button.active { background: var(--accent-soft); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.nav button.active .n { background: var(--accent); color: var(--accent-ink); }
.nav button .tag { margin-left: auto; font-size: 10px; color: var(--muted); border: 1px solid #333; border-radius: 999px; padding: 0 6px; }
.sidebar-foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid #262626; font-size: 12px; color: var(--muted); }
.sidebar-foot strong { display: block; color: #fff; font-size: 13px; }
.culture { margin-top: 10px; font-size: 11px; color: var(--muted); }
.culture b { color: var(--accent); }

main { min-width: 0; padding: 0 28px 48px; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; min-height: 76px;
  background: rgba(14, 14, 14, .92); backdrop-filter: blur(10px); border-bottom: 1px solid #1f1f1f; margin: 0 -28px 20px; padding: 0 28px;
}
.topbar h1 { margin: 0; font-size: 22px; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.top-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
#syncStatus { font-size: 12px; color: var(--muted); }
.menu-btn { display: none; }

/* ---------- controls ---------- */
.btn { border: 1px solid var(--line); background: var(--surface-2); color: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #4a4a4a; background: var(--surface-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { border-color: rgba(229, 72, 77, .5); color: #ff8b8e; }
.btn.small { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea {
  width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: #fff; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 84px; resize: vertical; }
label.field input, label.field select, label.field textarea { font-weight: 400; }
label.field { display: grid; gap: 5px; align-content: start; font-size: 12px; font-weight: 700; color: var(--text-2); }
label.field .req { color: var(--accent); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-2); }
.check input { width: auto; accent-color: var(--accent); }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid #262626; border-radius: var(--radius); padding: 18px; min-width: 0; }
.panel h2 { margin: 0 0 4px; font-size: 15px; }
.panel .sub { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.hero {
  position: relative; overflow: hidden; border-radius: var(--radius); padding: 22px 24px; margin-bottom: 16px;
  background: linear-gradient(100deg, #0b0b0b 0%, #1c1c1c 60%, #262626 100%); border: 1px solid #262626;
}
.hero.with-photo { background-size: cover; background-position: center; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 220px; height: 220px; border-radius: 50%; border: 28px solid var(--accent); opacity: .12; }
.hero h2 { margin: 4px 0 6px; font-size: 22px; }
.hero p { margin: 0; color: var(--text-2); max-width: 720px; }

.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-items: end; margin-bottom: 16px; }
.filters label { font-size: 11px; color: var(--muted); font-weight: 700; display: grid; gap: 4px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid #262626; border-radius: 12px; padding: 14px 16px; position: relative; overflow: hidden; }
.card span { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
.card strong { display: block; font-size: 28px; margin-top: 4px; letter-spacing: -.02em; }
.card small { color: var(--muted); font-size: 11px; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
.card.accent::before { background: var(--accent); }
.card.green::before { background: var(--green); }
.card.orange::before { background: var(--orange); }
.card.red::before { background: var(--red); }
.section-title { margin: 22px 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; }

.chart-box { position: relative; height: 280px; }
.chart-box:has(> .empty) { height: auto; }
.empty { color: var(--muted); font-size: 13px; padding: 26px; text-align: center; border: 1px dashed #333; border-radius: 12px; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid #262626; border-radius: 12px; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #242424; vertical-align: middle; }
th { position: sticky; top: 0; background: #181818; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
tbody tr { background: var(--surface); }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
td .muted, .muted { color: var(--muted); font-size: 12px; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--accent); }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #2a2a2a; color: var(--text-2); white-space: nowrap; }
.badge.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sla-verde { color: var(--green); background: rgba(63, 180, 107, .12); }
.sla-amarelo { color: var(--yellow); background: rgba(242, 194, 0, .12); }
.sla-laranja { color: var(--orange); background: rgba(240, 138, 36, .13); }
.sla-vermelho { color: var(--red); background: rgba(229, 72, 77, .13); }
.sla-neutro { color: var(--muted); background: #262626; }
.prio-Crítica { color: var(--red); } .prio-Alta { color: var(--orange); } .prio-Média { color: var(--yellow); } .prio-Baixa { color: var(--muted); }

.progress { height: 8px; background: #2a2a2a; border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 999px; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar .search { flex: 1 1 260px; }
.toolbar select { width: auto; min-width: 150px; }

/* ---------- dialogs ---------- */
dialog { border: 1px solid #2f2f2f; border-radius: 16px; padding: 0; background: var(--surface); color: #fff; width: min(980px, calc(100vw - 24px)); max-height: calc(100vh - 24px); box-shadow: var(--shadow); }
dialog.narrow { width: min(520px, calc(100vw - 24px)); }
dialog::backdrop { background: rgba(0, 0, 0, .7); }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #2a2a2a; position: sticky; top: 0; background: var(--surface); z-index: 2; }
.dlg-head h3 { margin: 0; font-size: 17px; }
.dlg-head .x { margin-left: auto; }
.dlg-body { padding: 18px 20px; overflow-y: auto; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid #2a2a2a; position: sticky; bottom: 0; background: var(--surface); }
.form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.form-grid .span-2 { grid-column: span 2; } .form-grid .span-4 { grid-column: 1 / -1; }
.form-section { grid-column: 1 / -1; margin: 8px 0 -2px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
.form-error { white-space: pre-line; background: rgba(229, 72, 77, .12); border: 1px solid rgba(229, 72, 77, .4); color: #ffb3b5; padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; }

.tabs { display: flex; gap: 6px; border-bottom: 1px solid #2a2a2a; margin-bottom: 14px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 12px; color: var(--muted); font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.active { color: #fff; border-color: var(--accent); }

.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 18px; }
.kv div span { display: block; font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.kv div p { margin: 2px 0 0; white-space: pre-line; }
.kv .wide { grid-column: 1 / -1; }

.sla-panel { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.sla-panel .card strong { font-size: 22px; }

.timeline { display: grid; gap: 8px; }
.timeline .item { background: var(--bg-2); border: 1px solid #262626; border-radius: 10px; padding: 10px 12px; }
.timeline .item b { color: var(--accent); }

.toast-area { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 100; }
.toast { background: #222; border: 1px solid #333; border-left: 4px solid var(--green); padding: 12px 14px; border-radius: 10px; box-shadow: var(--shadow); max-width: 380px; white-space: pre-line; }
.toast.error { border-left-color: var(--red); }

.placeholder { padding: 40px; text-align: center; }
.placeholder h2 { margin: 8px 0; }
.placeholder ul { text-align: left; display: inline-block; color: var(--text-2); }

.loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 200; }
.spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid #2a2a2a; border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .grid.two, .grid.three { grid-template-columns: 1fr; }
  .sla-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; width: 264px; transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow); }
  .sidebar.open { transform: translateX(0); }
  .menu-btn { display: inline-flex; }
  main { padding: 0 16px 40px; }
  .topbar { margin: 0 -16px 16px; padding: 10px 16px; flex-wrap: wrap; }
  .topbar h1 { font-size: 18px; }
  #syncStatus { display: none; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card strong { font-size: 22px; }
  .kv { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .span-2 { grid-column: auto; }
  .toolbar select { flex: 1 1 140px; }
}
</style>
